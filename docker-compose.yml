services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmacia-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: farmacia
      DB_USERNAME: farmacia
      DB_PASSWORD: farmacia_local
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - farmacia_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    container_name: farmacia-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: farmacia
      MYSQL_USER: farmacia
      MYSQL_PASSWORD: farmacia_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3307:3306"
    volumes:
      - farmacia_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  farmacia_mysql_data:
  farmacia_vendor:
